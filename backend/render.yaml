services:
  - type: web
    name: sahay-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install uv && uv sync --frozen"
    startCommand: "uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    region: singapore
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_B64
        sync: false
      - key: SIGNING_PRIVATE_KEY_B64
        sync: false
      - key: SIGNING_PUBLIC_KEY_B64
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PACK_BASE_URL
        sync: false
      - key: GROUP_MIN_SIZE
        sync: false
      - key: SMS_DAILY_CAP
        sync: false
      - key: SMS_WEBHOOK_SECRET
        sync: false
